### **6. Wiki**

Create page titled **Scraper Architecture**:

```markdown
# Application Architecture

## Data Flow Pipeline
1. **User Request**: User submits target URL and item limit from `dashboard.html`[cite: 5, 8].
2. **Fetch Layer**: `app.py` passes parameters to `scrape_products()` in `scraper.py`[cite: 5, 7].
3. **HTTP & HTML Parsing**: `requests.get()` fetches raw HTML, passed to `BeautifulSoup` using `html.parser`[cite: 7].
4. **Extraction**: `parse_product_card()` extracts title, price, stock status, rating, and absolute link[cite: 7].
5. **Caching**: Data persists to `data/scraped_data.json` and `data/scraped_data.csv`[cite: 5].
6. **Response**: JSON payload updates DOM dynamically or re-renders Jinja2 table view[cite: 5, 8].
```[cite: 5, 7, 8]

